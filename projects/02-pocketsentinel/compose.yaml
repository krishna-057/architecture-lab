name: pocketsentinel-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POCKETSENTINEL_POSTGRES_DB:-pocketsentinel}
      POSTGRES_USER: ${POCKETSENTINEL_POSTGRES_USER:-pocketsentinel}
      POSTGRES_PASSWORD: ${POCKETSENTINEL_POSTGRES_PASSWORD:-pocketsentinel}
    ports:
      - "${POCKETSENTINEL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pocketsentinel

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POCKETSENTINEL_POSTGRES_USER:-pocketsentinel}:${POCKETSENTINEL_POSTGRES_PASSWORD:-pocketsentinel}@postgres:5432/${POCKETSENTINEL_POSTGRES_DB:-pocketsentinel}
    ports:
      - "${POCKETSENTINEL_API_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pocketsentinel

networks:
  pocketsentinel:
